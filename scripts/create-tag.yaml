name: Create a new tag on github
vars:
  githubToken: ""
  lastCommitSHA: ""
runs:
  - scene:
      name: Create a new tag
      path: ../shares/github.tag.yaml
      vars:
        token: ${ $vars.githubToken }
        lastCommitSHA: ${ $vars.lastCommitSHA }
        owner: circle2jt
        repo: ymlr
        tag: "%s"
        packageJson: ~~/package.json
        validTagRegex: ""
